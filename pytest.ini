[pytest]
; 异步夹具默认作用域显式声明，避免 pytest-asyncio 0.25+ 的
; PytestDeprecationWarning（未来版本会由警告升级为错误）。
asyncio_default_fixture_loop_scope = function
asyncio_mode = strict

; 默认忽略性能测试脚本：它需要在运行中的服务上执行，不属于单元测试集合。
; 手动运行请用：python tests/run_performance.py
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; 过滤第三方库噪音，保留项目自身可行动的信息
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio.*
